<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Cedar Training Center — Dashboards</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --green:        #2ea82a;
  --green-bright: #6fdc6a;
  --green-deep:   #0e3b0c;
  --green-dark:   #1a6b18;
  --green-wash:   #eef6ec;
  --green-soft:   #d3ead0;
  --ink:          #16241a;
  --muted:        #687a6c;
  --border:       #e6ece4;
  --surface:      #ffffff;
  --bg:           #f4f7f2;
  --radius:       16px;
}

html { -webkit-text-size-adjust: 100%; }
body {
  font-family: 'Hanken Grotesk', system-ui, sans-serif;
  background: var(--bg);
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
  line-height: 1.5;
}
button { font-family: inherit; }
input, select, textarea { font-family: inherit; }
::selection { background: rgba(46,168,42,.2); }

/* ───────────────── LOGIN ───────────────── */
.login-wrap { min-height: 100vh; display: grid; grid-template-columns: 1.05fr 1fr; }
.login-brand {
  background: linear-gradient(150deg, var(--green-deep) 0%, #15561a 100%);
  padding: 56px 60px; position: relative; overflow: hidden;
  display: flex; flex-direction: column; justify-content: center;
}
.login-fern {
  position: absolute; right: -120px; bottom: -120px; width: 560px; height: 560px;
  background: radial-gradient(circle at 30% 30%, rgba(111,220,106,.18), transparent 60%);
  border-radius: 50%; pointer-events: none;
}
.login-h1 { font-size: clamp(2rem, 3vw, 2.9rem); font-weight: 800; color: #fff; letter-spacing: -0.03em; line-height: 1.08; margin-top: 40px; }
.login-p { font-size: 15px; color: rgba(255,255,255,.7); line-height: 1.7; max-width: 420px; margin-top: 20px; }
.login-stats { display: flex; gap: 44px; margin-top: 48px; padding-top: 32px; border-top: 1px solid rgba(255,255,255,.14); }
.ls-n { font-size: 30px; font-weight: 800; color: var(--green-bright); letter-spacing: -0.02em; }
.ls-l { font-size: 12px; color: rgba(255,255,255,.6); margin-top: 4px; }
.login-panel { display: flex; align-items: center; justify-content: center; padding: 40px; background: var(--surface); }
.role-card {
  display: flex; align-items: center; gap: 14px; width: 100%;
  background: var(--surface); border: 1.5px solid var(--border); border-radius: 14px;
  padding: 14px 16px; cursor: pointer; transition: border-color .18s, box-shadow .18s, transform .18s;
}
.role-card:hover { border-color: var(--green); box-shadow: 0 8px 26px rgba(46,168,42,.13); transform: translateY(-2px); }
.role-ic { width: 42px; height: 42px; border-radius: 11px; background: var(--green-wash); color: var(--green);
  display: flex; align-items: center; justify-content: center; flex-shrink: 0; }

/* ───────────────── SHELL ───────────────── */
.app-shell { min-height: 100vh; }
.sidebar-layout { display: grid; grid-template-columns: 250px 1fr; }

/* sidebar */
.sidebar {
  background: var(--green-deep); position: sticky; top: 0; height: 100vh;
  display: flex; flex-direction: column; padding: 22px 16px; gap: 4px;
}
.sidebar-logo { padding: 6px 8px 18px; }
.sidebar-section { font-size: 10.5px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase;
  color: rgba(255,255,255,.4); padding: 8px 12px 6px; }
.sidebar-nav { display: flex; flex-direction: column; gap: 3px; }
.snav-item {
  display: flex; align-items: center; gap: 12px; width: 100%; text-align: left;
  background: transparent; border: none; cursor: pointer; color: rgba(255,255,255,.74);
  font-size: 13.5px; font-weight: 600; padding: 10px 12px; border-radius: 10px;
  transition: background .15s, color .15s;
}
.snav-item:hover { background: rgba(255,255,255,.08); color: #fff; }
.snav-on { background: var(--green); color: #fff; box-shadow: 0 6px 18px rgba(46,168,42,.35); }
.snav-on:hover { background: var(--green); }
.sidebar-foot { margin-top: auto; padding-top: 14px; border-top: 1px solid rgba(255,255,255,.1); }
.sidebar-role { display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 600;
  color: rgba(255,255,255,.6); padding: 6px 12px 12px; }
.role-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green-bright); box-shadow: 0 0 0 3px rgba(111,220,106,.2); }

.main-col { min-width: 0; display: flex; flex-direction: column; }

/* topbar */
.topbar { height: 68px; background: rgba(255,255,255,.85); backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 16px;
  padding: 0 28px; position: sticky; top: 0; z-index: 40; }
.topbar-search { max-width: 320px; flex: 1; }
.icon-btn { position: relative; width: 38px; height: 38px; border-radius: 10px; border: 1px solid var(--border);
  background: var(--surface); color: var(--muted); cursor: pointer; display: flex; align-items: center;
  justify-content: center; transition: border-color .15s, color .15s; }
.icon-btn:hover { border-color: var(--green); color: var(--green); }
.icon-btn .dot { position: absolute; top: 8px; right: 9px; width: 7px; height: 7px; border-radius: 50%;
  background: #e0533f; border: 1.5px solid var(--surface); }
.topbar-user { display: flex; align-items: center; gap: 10px; }
.tu-meta { line-height: 1.2; }
.tu-name { font-size: 13px; font-weight: 700; color: var(--ink); white-space: nowrap; }
.tu-role { font-size: 11px; color: var(--muted); white-space: nowrap; }
.tu-meta { flex-shrink: 0; }

/* topnav layout */
.topnav { background: rgba(255,255,255,.9); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border);
  position: sticky; top: 0; z-index: 40; }
.topnav-inner { max-width: 1180px; margin: 0 auto; height: 70px; display: flex; align-items: center;
  gap: 20px; padding: 0 32px; }
.topnav-nav { display: flex; gap: 3px; margin-left: 18px; flex: 1; }
.tnav-item { display: flex; align-items: center; gap: 7px; background: transparent; border: none; cursor: pointer;
  color: var(--muted); font-size: 13.5px; font-weight: 600; padding: 9px 13px; border-radius: 9px;
  transition: background .15s, color .15s; white-space: nowrap; }
.tnav-item:hover { background: var(--green-wash); color: var(--green-dark); }
.tnav-on { background: var(--green-wash); color: var(--green-dark); }

/* content */
.content { padding: 30px 30px 60px; }
.content-centered { max-width: 1180px; margin: 0 auto; width: 100%; padding: 34px 32px 70px; }
.dens-compact .content, .dens-compact .content-centered { padding-top: 22px; }
.dens-comfy .content, .dens-comfy .content-centered { padding-top: 40px; }

/* ───────────────── PRIMITIVES ───────────────── */
.card { box-shadow: 0 1px 2px rgba(20,40,26,.03); }
.card-title { font-size: 15px; font-weight: 700; color: var(--ink); letter-spacing: -0.01em; }
.card-sub { font-size: 12.5px; color: var(--muted); margin-top: 2px; }

.btn-primary { display: inline-flex; align-items: center; gap: 8px; background: var(--green); color: #fff;
  border: none; cursor: pointer; font-size: 13.5px; font-weight: 700; padding: 10px 18px; border-radius: 11px;
  box-shadow: 0 6px 18px rgba(46,168,42,.28); transition: transform .16s, box-shadow .16s, background .16s; }
.btn-primary:hover { background: var(--green-dark); transform: translateY(-1px); box-shadow: 0 10px 26px rgba(46,168,42,.36); }
.btn-ghost { display: inline-flex; align-items: center; gap: 8px; background: var(--surface); color: var(--ink);
  border: 1.5px solid var(--border); cursor: pointer; font-size: 13.5px; font-weight: 700; padding: 10px 16px;
  border-radius: 11px; transition: border-color .16s, color .16s; }
.btn-ghost:hover { border-color: var(--green); color: var(--green); }
.mini-btn { display: inline-flex; align-items: center; gap: 5px; background: var(--green-wash); color: var(--green-dark);
  border: none; cursor: pointer; font-size: 12px; font-weight: 700; padding: 6px 12px; border-radius: 8px;
  transition: background .15s; }
.mini-btn:hover { background: var(--green-soft); }
.link-btn { display: inline-flex; align-items: center; gap: 3px; color: var(--green); font-size: 12.5px;
  font-weight: 700; cursor: pointer; text-decoration: none; }
.link-btn:hover { color: var(--green-dark); }

/* grids */
.grid-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
.grid-stats-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
.grid-2-1 { display: grid; grid-template-columns: 1.6fr 1fr; gap: 18px; }
.grid-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(255px, 1fr)); gap: 16px; }

/* table */
.trow:hover td { background: var(--green-wash); }
.trow td { transition: background .12s; }
.table-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 16px;
  padding: 16px 18px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
.search-field { display: flex; align-items: center; gap: 9px; background: var(--bg); border: 1.5px solid var(--border);
  border-radius: 10px; padding: 9px 13px; color: var(--muted); min-width: 200px; transition: border-color .15s; }
.search-field:focus-within { border-color: var(--green); }
.search-field input { border: none; background: transparent; outline: none; font-size: 13.5px; color: var(--ink); width: 100%; }
.chip { background: var(--bg); border: 1.5px solid var(--border); color: var(--muted); font-size: 12.5px;
  font-weight: 700; padding: 6px 13px; border-radius: 9px; cursor: pointer; transition: all .15s; }
.chip:hover { border-color: var(--green-soft); color: var(--green-dark); }
.chip-on { background: var(--green); border-color: var(--green); color: #fff; }

/* fields */
.select-field { display: flex; align-items: center; gap: 9px; background: var(--surface); border: 1.5px solid var(--border);
  border-radius: 11px; padding: 9px 14px; color: var(--muted); }
.select-field select, .select-field input { border: none; background: transparent; outline: none; font-size: 13.5px;
  font-weight: 600; color: var(--ink); cursor: pointer; }
.form-stack { display: flex; flex-direction: column; gap: 14px; }
.fld { display: flex; flex-direction: column; gap: 6px; }
.fld > span { font-size: 11.5px; font-weight: 700; color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
.fld input, .fld select, .fld textarea { background: var(--bg); border: 1.5px solid var(--border); border-radius: 10px;
  padding: 11px 13px; font-size: 13.5px; color: var(--ink); outline: none; transition: border-color .15s, box-shadow .15s; }
.fld input:focus, .fld select:focus, .fld textarea:focus { border-color: var(--green); box-shadow: 0 0 0 3px rgba(46,168,42,.12); }
.fld textarea { resize: vertical; }

/* modal */
.modal-backdrop { position: fixed; inset: 0; z-index: 200; background: rgba(14,59,12,.32);
  backdrop-filter: blur(3px); display: flex; align-items: center; justify-content: center; padding: 24px; }
.modal-card { background: var(--surface); border-radius: 18px; width: 100%; max-height: 90vh; overflow-y: auto;
  box-shadow: 0 30px 80px rgba(14,59,12,.3); animation: pop .2s cubic-bezier(.16,1,.3,1); }
.modal-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px;
  padding: 22px 24px 16px; border-bottom: 1px solid var(--border); position: sticky; top: 0;
  background: var(--surface); border-radius: 18px 18px 0 0; }
.modal-body { padding: 22px 24px; }
.modal-foot { display: flex; gap: 10px; justify-content: flex-end; padding: 16px 24px 22px; }
@keyframes pop { from { transform: translateY(12px) scale(.98); } to { transform: none; } }

/* toast */
.toast { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); z-index: 300;
  display: flex; align-items: center; gap: 10px; background: var(--green-deep); color: #fff;
  font-size: 13.5px; font-weight: 600; padding: 12px 20px; border-radius: 12px;
  box-shadow: 0 14px 40px rgba(14,59,12,.4); animation: toastIn .26s cubic-bezier(.16,1,.3,1); }
.toast .tic { color: var(--green-bright); display: flex; }
@keyframes toastIn { from { transform: translate(-50%, 16px); } to { transform: translate(-50%, 0); } }

/* parent child tabs */
.child-tab { display: flex; align-items: center; gap: 8px; background: var(--surface); border: 1.5px solid var(--border);
  border-radius: 11px; padding: 6px 14px 6px 6px; cursor: pointer; font-size: 13px; font-weight: 700; color: var(--muted);
  transition: all .15s; }
.child-tab:hover { border-color: var(--green-soft); }
.child-tab-on { border-color: var(--green); color: var(--green-dark); background: var(--green-wash); }

/* ───────────────── RESPONSIVE ───────────────── */
@media (max-width: 1080px) {
  .grid-2-1 { grid-template-columns: 1fr; }
  .grid-stats { grid-template-columns: repeat(2, 1fr); }
}
@media (max-width: 900px) {
  .login-wrap { grid-template-columns: 1fr; }
  .login-brand { display: none; }
  .sidebar-layout { grid-template-columns: 70px 1fr; }
  .sidebar { padding: 18px 10px; }
  .sidebar-logo span, .sidebar-section, .snav-item span, .sidebar-role { display: none; }
  .sidebar-logo { display: flex; justify-content: center; }
  .snav-item { justify-content: center; padding: 12px; }
  .topnav-nav { overflow-x: auto; }
}
@media (max-width: 680px) {
  .grid-stats, .grid-stats-3 { grid-template-columns: 1fr; }
  .content, .content-centered { padding: 20px 16px 50px; }
  .topbar-search { display: none; }
  .tu-meta { display: none; }
  .topnav-nav { display: none; }
}
</style>
</head>

<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script src="dash/data.js"></script>
